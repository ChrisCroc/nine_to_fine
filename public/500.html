<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <meta name="robots" content="noindex, nofollow">
    <title>Something went wrong - Nine to Fine</title>
    <link rel="icon" href="/icon.svg" type="image/svg+xml">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Playfair+Display:wght@400;700&display=swap">
    <style>
      *, *::before, *::after { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100dvh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 1rem;
        background-color: #e7dbc4;
        background-image: linear-gradient(to top right, oklch(42.1% .095 57.708), oklch(98.7% .026 102.212));
        font-family: "Inter", system-ui, sans-serif;
      }
      .card {
        max-width: 28rem;
        padding: 2.5rem 2rem;
        border-radius: 0.75rem;
        border: 1px solid rgba(198, 172, 121, 0.3);
        background-color: oklch(27.4% .006 286.033);
        box-shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
        text-align: center;
        color: #e7dbc4;
      }
      .code {
        margin: 0.75rem 0 0;
        font-family: "Playfair Display", serif;
        font-size: 2rem;
        font-weight: 700;
        color: rgba(231, 219, 196, 0.6);
      }
      h1 {
        margin: 0.5rem 0 0;
        font-family: "Playfair Display", serif;
        font-size: 1.25rem;
        font-weight: 700;
      }
      p.message {
        margin: 1rem 0 0;
        font-size: 1rem;
        line-height: 1.5;
        color: rgba(231, 219, 196, 0.8);
      }
      a {
        display: inline-block;
        margin-top: 2rem;
        padding: 0.5rem 1.25rem;
        border-radius: 0.375rem;
        background-color: oklch(21% .006 285.885);
        color: #e7dbc4;
        font-weight: 600;
        text-decoration: none;
      }
      a:hover { background-color: oklch(37% .013 285.805); }
    </style>
  </head>
  <body>
    <main class="card">
      <img src="/icon.svg" alt="Nine to Fine" width="36" height="36">
      <p class="code">500</p>
      <h1>Something went wrong on our side.</h1>
      <p class="message">This one is on us, not on you. Try again in a moment.</p>
      <a href="/">Back to home</a>
    </main>
  </body>
</html>
